name: Android Auto APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.0.0). Leave empty for automatic v1.0.<run_number>.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Test & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Signed Release APK (if keystore secrets configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            export KEYSTORE_PATH="${{ github.workspace }}/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon
          else
            echo "Release keystore secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) not set; skipping release APK and releasing debug APK."
          fi

      - name: Prepare Release Metadata & APK Assets
        id: prepare
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          mkdir -p release-assets
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/TapPilot-Agent-${TAG}-debug.apk"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-assets/TapPilot-Agent-${TAG}-release.apk"
          fi
          ls -lh release-assets/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tappilot-apks-${{ steps.prepare.outputs.tag }}
          path: release-assets/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: TapPilot Agent ${{ steps.prepare.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*.apk
